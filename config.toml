baseURL = "https://nassredean.com"
title = "Nassredean Nasseri"
author = "Nassredean Nasseri"
copyright = "Copyright © 2023, Nassredean Nasseri; all rights reserved."
paginate = 3
languageCode = "en"
DefaultContentLanguage = "en"
enableInlineShortcodes = true
# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson"]

[params]
  copyright = "© nassredean"

  [params.logo]
    name = "nassredean"

  [[params.socialIcons]]
    name = "github"
    title = "My github"
    url = "https://github.com/nassredean"
  
  [[params.socialIcons]]
    name = "linkedin"
    title = "My LinkedIn"
    url = "https://www.linkedin.com/in/nassredean-nasseri-134521232/"

  [[params.socialIcons]]
    name = "instagram"
    title = "My art"
    url = "https://www.instagram.com/nassredean.art/"


[menu]

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[privacy]

  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.twitter]
    disabled = false
    enableDNT = true
    simple = true

  [privacy.instagram]
    disabled = false
    simple = true

  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]

  [services.instagram]
    disableInlineCSS = true

  [services.twitter]
    disableInlineCSS = true
