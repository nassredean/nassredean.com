<div class="social-icons">
  {{- range . }}
  {{- if eq (.name | lower) "email" }}
  <a class="js-email-link" data-user="{{ .user }}" data-domain="{{ .domain }}" rel="me" title="{{ (.title | default .name) | title }}">
    {{ partial "svg.html" . }}
  </a>
  {{- else }}
  <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me" title="{{ (.title | default .name) | title }}">
    {{ partial "svg.html" . }}
  </a>
  {{- end }}
  {{- end }}
</div>
